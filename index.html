<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030307">
  <title>My Only Love of Life — Zuhaa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="Animated starry love message">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <section class="message">
      <p class="eyebrow">A little piece of my universe</p>
      <h1 id="headline">MY ONLY LOVE OF LIFE <span>(ZUHAA)</span></h1>
      <p class="subtitle">Under the same stars, always. <span class="heart">♥</span></p>
    </section>
    <div class="bottom-note">MADE WITH LOVE <span>✦</span> FOR ZUHAA</div>
    <button id="replay" class="replay" type="button" aria-label="Replay text animation">↻ <span>Replay animation</span></button>
    <div class="sound-note">A quiet little universe</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
